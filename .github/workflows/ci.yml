name: CI

# Makers auto-deploys whatever lands on main — this workflow is the gate.
# Workflow: branch → PR → green CI → merge → Makers builds & deploys.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck & build frontend
        run: npm run build

      - name: Syntax-check Python agents & cloud functions
        run: python -m compileall agents cloud-functions
